name: ZK Full Compile (AVX2 key generation)

# Runs compact compile WITHOUT --skip-zk to confirm prover/verifier keys
# can be generated end-to-end.  GitHub Actions ubuntu-latest runners have
# AVX2 support, which satisfies the zkir binary requirement.
#
# This workflow closes the testing gap documented in
# docs/known-limitations.md section 6.
#
# Install method: compact devtools CLI v0.5.2 (official supported method per
# https://docs.midnight.network/blog/compact-developer-tools), then
# `compact update 0.34.0` to pin the exact compiler version used in this repo.

on:
  workflow_dispatch:          # trigger manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'contract/**'         # re-run whenever contract source changes

jobs:
  zk-full-compile:
    name: Full ZK compile + smoke test
    runs-on: ubuntu-latest    # ubuntu-latest has AVX2; confirmed on all
                              # GitHub-hosted runners since 2021

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify AVX2 support
        run: |
          echo "CPU flags (avx* only):"
          grep -o 'avx[^ ]*' /proc/cpuinfo | sort -u
          grep -q 'avx2' /proc/cpuinfo && echo "✅ AVX2 confirmed" || (echo "❌ AVX2 not found — zkir will SIGILL" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install compact toolchain
        # Official install method: compact devtools CLI, then pin compiler to
        # the exact version used in this repo (0.34.0 / Compact language 0.26.0).
        # Source: https://docs.midnight.network/blog/compact-developer-tools
        # Installer: https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh
        run: |
          echo "Installing compact devtools CLI v0.5.2..."
          curl -fsSL https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          # Installer puts the binary in ~/.local/bin; add to PATH for this job
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install compact toolchain compiler v0.34.0
        run: |
          compact update 0.34.0
          echo "Compact toolchain version:"
          compact compile --version

      - name: Install npm dependencies
        run: npm ci

      - name: Generate issuer keypair
        run: npm run issuer:generate

      - name: Full compile (WITH ZK key generation)
        run: |
          echo "Running: compact compile (no --skip-zk)"
          npm run compile:full
          echo "Listing generated artefacts:"
          find contract/managed -type f | sort

      - name: Verify key artefacts exist
        # The compiler produces .prover and .verifier files (not .pk/.vk)
        run: |
          echo "Checking for prover/verifier key files..."
          PROVER_COUNT=$(find contract/managed -name '*.prover' | wc -l)
          VERIFIER_COUNT=$(find contract/managed -name '*.verifier' | wc -l)
          echo "Prover keys:   $PROVER_COUNT"
          echo "Verifier keys: $VERIFIER_COUNT"
          [ "$PROVER_COUNT" -ge 4 ] || (echo "❌ Expected 4 .prover files, found $PROVER_COUNT" && exit 1)
          [ "$VERIFIER_COUNT" -ge 4 ] || (echo "❌ Expected 4 .verifier files, found $VERIFIER_COUNT" && exit 1)
          echo "✅ Key artefacts generated for all 4 circuits"
          echo ""
          echo "Key file sizes:"
          ls -lh contract/managed/credit-attestation/keys/

      - name: Run unit tests
        run: npm test

      - name: Run smoke test (against full ZK build)
        run: npm run smoke-test

      - name: Upload key artefacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zk-keys
          path: contract/managed/
          retention-days: 7
